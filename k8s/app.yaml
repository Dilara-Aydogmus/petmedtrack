apiVersion: apps/v1
kind: Deployment
metadata:
  name: pet-info-health-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pet-info-health-service
  template:
    metadata:
      labels:
        app: pet-info-health-service
    spec:
      containers:
        - name: pet-info-health-service
          image: pet-info-health-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: petmedtrack-env
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:sqlserver://host.docker.internal:1433;databaseName=petmedtrack;encrypt=true;trustServerCertificate=true"
            - name: SPRING_RABBITMQ_HOST
              value: host.docker.internal
            - name: SPRING_RABBITMQ_PORT
              value: "5672"
---
apiVersion: v1
kind: Service
metadata:
  name: pet-info-health-service
spec:
  selector:
    app: pet-info-health-service
  type: LoadBalancer
  ports:
    - name: http
      port: 8080
      targetPort: 8080
